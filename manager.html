<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>标签组管理 - Auto Tab Group Manager</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      min-width: 720px;
      font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      color: #202124;
      background-color: #f8f9fa;
    }

    .page-header {
      max-width: 1080px;
      margin: 0 auto 16px;
    }

    .page-header h1 {
      font-size: 20px;
      margin: 0 0 4px;
    }

    .page-header p {
      margin: 0;
      color: #5f6368;
      font-size: 13px;
    }

    .page-header p + p {
      margin-top: 6px;
      font-size: 12px;
    }

    .page-header code {
      padding: 1px 4px;
      font-size: 11px;
      background-color: #f1f3f4;
      border-radius: 3px;
    }

    .page-summary {
      margin-top: 6px;
      padding: 6px 10px;
      font-size: 12px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      color: #5f6368;
      background-color: #f1f3f4;
      border-radius: 4px;
    }

    /* 顶部工具栏：全局一键操作 */
    .toolbar {
      max-width: 1080px;
      margin: 0 auto 12px;
      padding: 12px;
      background-color: #fff;
      border: 1px solid #dadce0;
      border-radius: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .toolbar-title {
      font-size: 13px;
      color: #5f6368;
      margin-right: 4px;
    }

    /* 手动关闭休眠的独立 row：与 .toolbar 同卡片外观，但上方留小间距 */
    .toolbar-manual {
      margin-top: -4px;
    }

    .toolbar-manual input[type="number"] {
      padding: 5px 6px;
      font-size: 13px;
      font-family: inherit;
      border: 1px solid #dadce0;
      border-radius: 4px;
    }

    button {
      padding: 7px 14px;
      font-size: 13px;
      font-family: inherit;
      color: #1a73e8;
      background-color: #fff;
      border: 1px solid #dadce0;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background-color: #f1f3f4;
      border-color: #c6c6c6;
    }

    button:disabled {
      color: #9aa0a6;
      background-color: #f1f3f4;
      border-color: #e8eaed;
      cursor: not-allowed;
    }

    button.danger {
      color: #d93025;
    }

    button.danger:hover:not(:disabled) {
      background-color: #fce8e6;
      border-color: #f2b8b5;
    }

    /* 提示条：进行中 / 错误 / 结果 */
    .banner {
      max-width: 1080px;
      margin: 0 auto 12px;
      padding: 10px 12px;
      border-radius: 4px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .banner[hidden] {
      display: none;
    }

    .banner-busy {
      background-color: #e8f0fe;
      color: #1967d2;
      border: 1px solid #c6dafc;
    }

    .banner-error {
      background-color: #fce8e6;
      color: #c5221f;
      border: 1px solid #f2b8b5;
    }

    .banner-result {
      background-color: #fef7e0;
      color: #b06000;
      border: 1px solid #fde293;
    }

    .banner-text {
      flex: 1;
    }

    .banner button {
      padding: 4px 10px;
      font-size: 12px;
    }

    /* 窗口区块 */
    .window-block {
      max-width: 1080px;
      margin: 0 auto 16px;
      background-color: #fff;
      border: 1px solid #dadce0;
      border-radius: 8px;
      overflow: hidden;
    }

    .window-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background-color: #f1f3f4;
      border-bottom: 1px solid #dadce0;
    }

    .window-header h2 {
      font-size: 14px;
      margin: 0;
    }

    .window-stat {
      color: #5f6368;
      font-size: 12px;
    }

    .badge {
      padding: 2px 8px;
      font-size: 11px;
      border-radius: 10px;
      background-color: #e8f0fe;
      color: #1967d2;
      border: 1px solid #c6dafc;
    }

    /* 标签组卡片 */
    .group-list {
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .group-card {
      border: 1px solid #e8eaed;
      border-left-width: 4px;
      border-radius: 6px;
      padding: 10px 12px;
      background-color: #fff;
    }

    .group-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .color-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .group-name {
      font-weight: bold;
      font-size: 14px;
    }

    .group-count {
      color: #5f6368;
      font-size: 12px;
    }

    .group-state {
      padding: 1px 6px;
      font-size: 11px;
      border-radius: 3px;
      background-color: #f1f3f4;
      color: #5f6368;
    }

    .group-state-collapsed {
      background-color: #fef7e0;
      color: #b06000;
    }

    /* 组内无已打开标签页（如浏览器重启后已保存但未恢复的组） */
    .group-state-empty {
      background-color: #f1f3f4;
      color: #80868b;
      border: 1px dashed #dadce0;
    }

    .group-hint {
      margin: 8px 0 0;
      padding: 6px 8px;
      font-size: 12px;
      color: #80868b;
      background-color: #fafafa;
      border-radius: 4px;
    }

    .group-actions {
      margin-left: auto;
      display: flex;
      gap: 6px;
    }

    .group-actions button {
      padding: 4px 10px;
      font-size: 12px;
    }

    /* 组内标签页列表 */
    .tab-list {
      list-style: none;
      margin: 8px 0 0;
      padding: 0;
    }

    .tab-list[hidden] {
      display: none;
    }

    .tab-item {
      display: grid;
      grid-template-columns: 24px 1fr 1fr 1fr;
      align-items: center;
      column-gap: 8px;
      padding: 5px 6px;
      border-bottom: 1px solid #f1f3f4;
      cursor: pointer;
      border-radius: 3px;
    }

    .tab-item:last-child {
      border-bottom: none;
    }

    .tab-item:hover {
      background-color: #f8f9fa;
    }

    .tab-index {
      color: #9aa0a6;
      font-size: 11px;
      text-align: right;
    }

    .tab-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tab-host {
      color: #9aa0a6;
      font-size: 11px;
      min-width: 0;
      text-align: left;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tab-host-path {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tab-dormancy {
      color: #9aa0a6;
      font-size: 11px;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 空状态 */
    .empty-state {
      max-width: 1080px;
      margin: 0 auto;
      padding: 48px 16px;
      text-align: center;
      color: #5f6368;
      background-color: #fff;
      border: 1px dashed #dadce0;
      border-radius: 8px;
    }

    /* in-page 二次确认对话框：替代 window.confirm，避免扩展页内 confirm 静默失败 */
    .confirm-dialog {
      max-width: 480px;
      padding: 20px 24px;
      border: 1px solid #dadce0;
      border-radius: 8px;
      background-color: #fff;
      color: #202124;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
    }

    .confirm-dialog::backdrop {
      background-color: rgba(32, 33, 36, 0.45);
    }

    .confirm-dialog h3 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .confirm-dialog p {
      margin: 0 0 16px;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      color: #3c4043;
    }

    .confirm-dialog .confirm-dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .empty-state[hidden] {
      display: none;
    }

    .empty-state p {
      margin: 4px 0;
    }

    /* ===== 视觉层升级：深色控制台 + 暖纸张工作台 ===== */
    :root {
      --ink: #182326;
      --muted: #758184;
      --paper: #f3f0e8;
      --card: rgba(255, 255, 255, 0.86);
      --line: #dfe4df;
      --teal: #0b8177;
      --teal-dark: #075954;
      --orange: #dd8241;
      --coral: #d75a4a;
      --shadow: 0 18px 42px rgba(27, 47, 45, 0.11);
    }

    body {
      position: relative;
      min-width: 780px;
      padding: 30px 32px 52px;
      color: var(--ink);
      background:
        radial-gradient(circle at 92% 2%, rgba(13, 130, 120, 0.11), transparent 24%),
        linear-gradient(145deg, #faf9f4 0%, var(--paper) 58%, #e8eee8 100%);
      font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0.01em;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: 0.28;
      background-image: linear-gradient(rgba(24, 35, 38, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(24, 35, 38, 0.035) 1px, transparent 1px);
      background-size: 22px 22px;
    }

    .page-header {
      position: relative;
      overflow: hidden;
      max-width: 1160px;
      margin: 0 auto 20px;
      padding: 30px 34px 24px;
      border: none;
      border-radius: 24px;
      color: #f4faf7;
      background: linear-gradient(135deg, #17383b 0%, #0c5957 100%);
      box-shadow: 0 22px 48px rgba(12, 67, 65, 0.2);
    }

    .page-header::after {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      right: -54px;
      top: -110px;
      border: 1px solid rgba(176, 236, 216, 0.3);
      border-radius: 50%;
      box-shadow: 0 0 0 24px rgba(176, 236, 216, 0.08), 0 0 0 48px rgba(176, 236, 216, 0.04);
    }

    .page-header h1 {
      position: relative;
      z-index: 1;
      margin: 0 0 8px;
      color: #f4faf7;
      font-family: Georgia, "Songti SC", "STSong", serif;
      font-size: 34px;
      letter-spacing: -0.045em;
      line-height: 1;
    }

    .page-header h1::after {
      content: " / CONTROL DECK";
      display: block;
      margin-top: 10px;
      color: #8dd4c2;
      font-family: "Avenir Next", "PingFang SC", sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
    }

    .page-header p {
      position: relative;
      z-index: 1;
      max-width: 780px;
      color: #c4d9d3;
      font-size: 13px;
      line-height: 1.7;
    }

    .page-header p + p {
      color: #8fbab1;
    }

    .page-header code {
      color: #e7fff6;
      background: rgba(255, 255, 255, 0.12);
    }

    .page-summary {
      position: relative;
      z-index: 1;
      margin-top: 16px;
      color: #d8f0e8;
      background: rgba(5, 42, 43, 0.45);
      border: 1px solid rgba(174, 229, 212, 0.22);
      border-radius: 10px;
    }

    .toolbar {
      max-width: 1160px;
      margin: 0 auto 12px;
      padding: 14px 16px;
      gap: 9px;
      border: 1px solid rgba(211, 220, 214, 0.92);
      border-radius: 16px;
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .toolbar-manual {
      margin-top: -4px;
      background: rgba(246, 249, 245, 0.9);
    }

    .toolbar-title {
      margin-right: 7px;
      color: var(--teal-dark);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    button {
      min-height: 34px;
      padding: 7px 13px;
      color: var(--teal-dark);
      background: #edf7f1;
      border: 1px solid #b9ddd0;
      border-radius: 9px;
      font-family: inherit;
      font-weight: 700;
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    button:hover:not(:disabled) {
      background: #dff1e8;
      border-color: #91caba;
      box-shadow: 0 5px 12px rgba(13, 130, 120, 0.12);
      transform: translateY(-1px);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button.danger {
      color: #b7463b;
      background: #fff3ef;
      border-color: #efc4bc;
    }

    button.danger:hover:not(:disabled) {
      background: #ffe7e1;
      border-color: #e8a095;
    }

    .toolbar-manual input[type="number"] {
      width: 78px !important;
      min-height: 34px;
      padding: 7px 9px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 9px;
      font: 700 12px/1 "Avenir Next", sans-serif;
      outline: none;
    }

    .toolbar-manual input[type="number"]:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(13, 130, 120, 0.12);
    }

    .banner {
      max-width: 1160px;
      margin: 0 auto 12px;
      border-radius: 11px;
      box-shadow: 0 6px 18px rgba(27, 47, 45, 0.06);
    }

    .banner-busy {
      color: var(--teal-dark);
      background: #e5f5ee;
      border-color: #b8ddd0;
    }

    .banner-error {
      color: #b7463b;
      background: #fff0ed;
      border-color: #efc4bc;
    }

    .banner-result {
      color: #97601e;
      background: #fff7df;
      border-color: #ecd698;
    }

    .window-block {
      max-width: 1160px;
      margin: 0 auto 18px;
      border: 1px solid rgba(211, 220, 214, 0.95);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.84);
      box-shadow: var(--shadow);
      animation: rise-in 360ms ease both;
    }

    .window-header {
      padding: 15px 18px;
      background: linear-gradient(90deg, #edf4ef, #f8faf6);
      border-bottom: 1px solid var(--line);
    }

    .window-header h2 {
      color: var(--ink);
      font-family: Georgia, "Songti SC", "STSong", serif;
      font-size: 18px;
      letter-spacing: -0.025em;
    }

    .window-stat {
      color: var(--muted);
      font-size: 12px;
    }

    .badge {
      color: var(--teal-dark);
      background: #d9f1e6;
      border-color: #b4ddce;
      font-weight: 700;
    }

    .group-list {
      padding: 14px 18px 18px;
      gap: 11px;
    }

    .group-card {
      padding: 13px 14px;
      border: 1px solid #e2e8e2;
      border-left: 4px solid var(--teal);
      border-radius: 13px;
      background: rgba(252, 253, 250, 0.9);
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .group-card:hover {
      box-shadow: 0 9px 22px rgba(27, 47, 45, 0.08);
      transform: translateY(-1px);
    }

    .group-card-header {
      padding-bottom: 9px;
      border-bottom: 1px solid #edf0eb;
    }

    .group-name {
      color: var(--ink);
      font-size: 15px;
      letter-spacing: -0.015em;
    }

    .group-count,
    .group-state {
      color: var(--muted);
    }

    .group-state {
      background: #f0f4ef;
      border: 1px solid #e1e8e0;
    }

    .group-state-collapsed {
      color: #94601e;
      background: #fff5d8;
      border-color: #ecd698;
    }

    .group-actions button {
      min-height: 29px;
      padding: 5px 10px;
      font-size: 11px;
    }

    .group-hint {
      color: var(--muted);
      background: #f6f8f4;
      border: 1px dashed #dce5dc;
    }

    .tab-list {
      margin-top: 10px;
    }

    .tab-item {
      grid-template-columns: 32px minmax(0, 1.35fr) minmax(0, 1fr) 90px;
      column-gap: 12px;
      min-height: 35px;
      padding: 7px 8px;
      border-bottom-color: #edf0eb;
    }

    .tab-item:hover {
      background: #f3f8f4;
    }

    .tab-head {
      min-height: 24px;
      color: #9aa6a2;
      border-bottom: 1px solid #dfe8e0;
      cursor: default;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .tab-head:hover {
      background: transparent;
    }

    .tab-index {
      color: #9aa6a2;
    }

    .tab-title {
      color: #2d3c3e;
      font-weight: 600;
    }

    .tab-host,
    .tab-dormancy {
      color: #859391;
    }

    .empty-state {
      max-width: 1160px;
      margin: 0 auto;
      border: 1px dashed #bfd5c9;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: var(--shadow);
    }

    .confirm-dialog {
      border: 1px solid #cfe0d7;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(17, 46, 43, 0.22);
    }

    @keyframes rise-in {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="page-header">
    <h1>标签组管理</h1>
    <p>集中管理已存在的标签组：一键展开、排序、解散或关闭。未分组的标签页不会出现在这里，也不会被任何操作影响。</p>
    <p>注意：“已保存但未点开”的标签组（浏览器重启后需手动点开的那种）不在扩展接口可见范围内，因此不会出现在下方列表中。若希望重启后组仍可管理，请在 <code>chrome://settings/onStartup</code> 选择“继续浏览上次打开的网页”。</p>
    <p class="page-summary" id="summary">正在读取标签组…</p>
  </div>

  <div class="toolbar">
    <span class="toolbar-title">全局操作</span>
    <button type="button" data-action="expand-all">全部展开</button>
    <button type="button" data-action="collapse-all">全部折叠</button>
    <button type="button" data-action="sort-all">全部排序</button>
    <button type="button" data-action="ungroup-all">全部解散</button>
    <button type="button" data-action="close-dormant">关闭休眠</button>
    <button type="button" data-action="close-all" class="danger">全部关闭标签页</button>
    <button type="button" data-action="refresh">刷新</button>
  </div>

  <div class="toolbar toolbar-manual">
    <span class="toolbar-title">手动关闭休眠</span>
    <span>关闭超过</span>
    <input type="number" id="manual-close-minutes" min="1" step="1" style="width:60px;margin-left:4px">
    <span>分钟未活动的标签页</span>
    <button type="button" data-action="manual-close-dormant">关闭 &gt;N 分钟未活动</button>
    <div class="mapping-error" id="manual-close-error" style="margin:0 0 0 8px;"></div>
  </div>

  <div class="banner banner-busy" id="busy-banner" hidden>
    <span class="banner-text" id="busy-text">正在处理…</span>
  </div>

  <div class="banner banner-error" id="error-banner" hidden>
    <span class="banner-text" id="error-text"></span>
    <button type="button" data-action="retry">重试</button>
  </div>

  <div class="banner banner-result" id="result-banner" hidden>
    <span class="banner-text" id="result-text"></span>
    <button type="button" data-action="dismiss-result">知道了</button>
  </div>

  <div id="windows-container"></div>

  <div class="empty-state" id="empty-state" hidden>
    <p><strong>暂无标签组</strong></p>
    <p>打开至少两个同域名的标签页，或在弹窗中点击"重新整理所有标签页"后再回到这里。</p>
  </div>

  <dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-dialog-title">
    <h3 id="confirm-dialog-title">请确认</h3>
    <p id="confirm-dialog-message"></p>
    <div class="confirm-dialog-actions">
      <button type="button" data-confirm-action="cancel">取消</button>
      <button type="button" data-confirm-action="confirm">确认</button>
    </div>
  </dialog>

  <script src="common.js"></script>
  <script src="manager.js"></script>
</body>
</html>
