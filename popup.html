<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --ink: #182326;
      --muted: #738184;
      --paper: #f4f6f1;
      --card: rgba(255, 255, 255, 0.88);
      --line: #dce4df;
      --teal: #0d8278;
      --teal-dark: #075c58;
      --coral: #d75a4a;
      --shadow: 0 14px 34px rgba(18, 43, 40, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--paper);
    }

    body {
      width: 340px;
      min-height: 100%;
      margin: 0;
      padding: 16px;
      color: var(--ink);
      background:
        radial-gradient(circle at 100% 0, rgba(13, 130, 120, 0.13), transparent 36%),
        linear-gradient(145deg, #f8faf6 0%, var(--paper) 58%, #e9f0eb 100%);
      font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 13px;
      letter-spacing: 0.01em;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.22;
      background-image: linear-gradient(rgba(24, 35, 38, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(24, 35, 38, 0.035) 1px, transparent 1px);
      background-size: 18px 18px;
    }

    .header,
    .mapping-section,
    .groups-container {
      position: relative;
      z-index: 1;
      margin: 0;
      padding: 16px;
      border: 1px solid rgba(220, 228, 223, 0.92);
      border-radius: 18px;
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .header {
      overflow: hidden;
      padding: 18px;
      background: linear-gradient(145deg, #173438 0%, #124c4c 100%);
      color: #f5faf7;
      border: none;
    }

    .header::after {
      content: "";
      position: absolute;
      width: 130px;
      height: 130px;
      right: -42px;
      top: -58px;
      border: 1px solid rgba(173, 235, 218, 0.28);
      border-radius: 50%;
      box-shadow: 0 0 0 16px rgba(173, 235, 218, 0.08), 0 0 0 32px rgba(173, 235, 218, 0.05);
    }

    h1,
    h2 {
      font-family: Georgia, "Songti SC", "STSong", serif;
      letter-spacing: -0.035em;
    }

    h1 {
      position: relative;
      z-index: 1;
      margin: 0 0 8px;
      font-size: 23px;
      line-height: 1.05;
      font-weight: 700;
    }

    h1::after {
      content: " / TAB SYSTEM";
      display: block;
      margin-top: 7px;
      color: #8bd1c1;
      font-family: "Avenir Next", "PingFang SC", sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.16em;
    }

    .info {
      position: relative;
      z-index: 1;
      margin: 0 0 16px;
      color: #c4d9d3;
      font-size: 12px;
      line-height: 1.65;
    }

    .info p {
      margin: 0;
    }

    .info p + p {
      margin-top: 4px;
      color: #91b9b0;
    }

    button {
      width: 100%;
      min-height: 36px;
      margin: 0;
      padding: 8px 11px;
      color: var(--teal-dark);
      background: #e8f5ef;
      border: 1px solid #b8ddd0;
      border-radius: 9px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    button:hover:not(:disabled) {
      background: #d6eee4;
      box-shadow: 0 5px 12px rgba(13, 130, 120, 0.14);
      transform: translateY(-1px);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.48;
      cursor: not-allowed;
    }

    #open-manager-btn {
      color: #f5faf7;
      background: #e28b45;
      border-color: #e28b45;
      box-shadow: 0 7px 14px rgba(226, 139, 69, 0.22);
    }

    #open-manager-btn:hover:not(:disabled) {
      background: #ee9d57;
    }

    #organize {
      color: #e9fffa;
      background: var(--teal);
      border-color: var(--teal);
    }

    #close-group-btn {
      color: #fff4f1;
      background: transparent;
      border-color: rgba(255, 188, 174, 0.55);
    }

    #close-group-btn:hover:not(:disabled) {
      background: rgba(215, 90, 74, 0.24);
      border-color: #e98a7c;
    }

    .toggle-row {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      margin: 0 0 9px;
      color: #d5e8e2;
      font-size: 12px;
      line-height: 1.3;
      cursor: pointer;
    }

    .toggle-row input {
      margin: 0;
      cursor: pointer;
    }

    .toggle-row input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: #8bd1c1;
    }

    .toggle-row input[type="number"] {
      width: 56px;
      margin-left: auto;
      padding: 5px 6px;
      color: var(--ink);
      background: #f7fbf8;
      border: 1px solid #b8ddd0;
      border-radius: 7px;
      font: 700 12px/1 "Avenir Next", sans-serif;
      cursor: text;
    }

    .toggle-row select {
      max-width: 180px;
      margin-left: auto;
      padding: 6px 8px;
      color: var(--ink);
      background: #f7fbf8;
      border: 1px solid #b8ddd0;
      border-radius: 7px;
      font: 700 11px/1.2 "Avenir Next", "PingFang SC", sans-serif;
      cursor: pointer;
    }

    .toggle-row select:focus {
      outline: none;
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(13, 130, 120, 0.12);
    }

    .grouping-mode-hint {
      position: relative;
      z-index: 1;
      margin: -4px 0 10px 22px;
      color: #91b9b0;
      font-size: 10px;
      line-height: 1.45;
    }

    .toggle-row .config-save-btn {
      width: auto;
      min-height: 26px;
      padding: 4px 10px;
      color: #d6eee4;
      background: transparent;
      border-color: rgba(184, 221, 208, 0.58);
      font-size: 11px;
    }

    .toggle-row .config-save-btn.dirty {
      color: #174a45;
      background: #bce8d7;
      border-color: #bce8d7;
    }

    .mapping-error {
      display: none;
      color: var(--coral);
      font-size: 11px;
      line-height: 1.45;
    }

    .header .mapping-error {
      position: relative;
      z-index: 1;
      margin: -3px 0 9px 22px;
      color: #ffb5a8;
    }

    .header-actions {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(173, 235, 218, 0.16);
    }

    .header-actions #open-manager-btn,
    .header-actions #organize {
      grid-column: 1 / -1;
    }

    .mapping-section,
    .groups-container {
      padding: 15px;
    }

    h2 {
      margin: 0 0 12px;
      color: var(--ink);
      font-size: 17px;
      line-height: 1;
    }

    .mapping-form {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 9px;
    }

    .mapping-form input {
      width: 100%;
      padding: 9px 10px;
      color: var(--ink);
      background: #fbfdfb;
      border: 1px solid var(--line);
      border-radius: 9px;
      outline: none;
      font-family: inherit;
      font-size: 12px;
      line-height: 1.2;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .mapping-form input:focus,
    .toggle-row input[type="number"]:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(13, 130, 120, 0.12);
    }

    .mapping-form button {
      color: #fff;
      background: var(--teal);
      border-color: var(--teal);
    }

    .mapping-actions {
      display: flex;
      gap: 7px;
      margin: 0 0 11px;
    }

    .mapping-actions button {
      min-height: 31px;
      padding: 6px 9px;
      color: var(--muted);
      background: #f0f4f0;
      border-color: var(--line);
      font-size: 11px;
    }

    .mapping-list,
    .group-tree {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .mapping-item,
    .group-item {
      border: 1px solid var(--line);
      border-radius: 11px;
      background: rgba(249, 252, 249, 0.82);
    }

    .mapping-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 9px;
      font-size: 11px;
    }

    .mapping-item + .mapping-item,
    .group-item + .group-item {
      margin-top: 7px;
    }

    .mapping-text,
    .group-title,
    .tab-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .mapping-text {
      flex: 1;
      color: #435457;
    }

    .close-btn {
      flex: 0 0 22px;
      width: 22px;
      min-height: 22px;
      padding: 0;
      color: #b8483d;
      background: #fff0ed;
      border-color: #f1c4bd;
      border-radius: 7px;
      font-size: 15px;
      line-height: 1;
    }

    .group-item {
      padding: 10px;
      transition: border-color 160ms ease, transform 160ms ease;
    }

    .group-item:hover {
      border-color: #a9d1c5;
      transform: translateY(-1px);
    }

    .group-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .group-title {
      flex: 1;
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
    }

    .group-tabs {
      list-style: none;
      padding: 8px 0 0 8px;
      margin: 0;
    }

    .group-tabs .tab-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 0;
      color: #5d6c6f;
      border-bottom: 1px solid #e8eeea;
      font-size: 11px;
    }

    .group-tabs .tab-item:last-child {
      border-bottom: none;
    }

    .group-tabs .tab-title {
      flex: 1;
    }

    .empty-groups,
    .empty-mappings {
      padding: 14px 8px;
      color: var(--muted);
      text-align: center;
      font-size: 11px;
    }

    .groups-container {
      max-height: 300px;
      overflow-y: auto;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-thumb {
      background: #bed3cb;
      border-radius: 99px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Auto Tab Group Manager</h1>
    <div class="info">
      <p>按域名自动归组，支持自定义组名、多域名合组、排序和闲置标签页管理。</p>
      <p>默认按主域名归组，例如 www.bilibili.com 与 search.bilibili.com 都归入 bilibili.com。</p>
    </div>
    <label class="toggle-row">
      <input type="checkbox" id="auto-grouping-toggle" checked>
      <span>自动分组</span>
    </label>
    <label class="toggle-row">
      <span>域名分组方式</span>
      <select id="domain-grouping-mode" aria-label="域名分组方式">
        <option value="registrable-domain">按主域名（推荐）</option>
        <option value="full-hostname">按完整域名</option>
      </select>
    </label>
    <p class="grouping-mode-hint">更改后点击“重新整理所有标签页”可应用到现有标签页。</p>
    <label class="toggle-row">
      <input type="checkbox" id="auto-collapse-toggle" checked>
      <span>无活动自动折叠</span>
      <input type="number" id="auto-collapse-minutes" min="1" step="1">
      <span>分钟</span>
      <button type="button" id="auto-collapse-save" class="config-save-btn">保存</button>
    </label>
    <div class="mapping-error" id="auto-collapse-error"></div>
    <label class="toggle-row">
      <input type="checkbox" id="auto-close-toggle">
      <span>自动关闭休眠</span>
      <input type="number" id="auto-close-minutes" min="1" step="1">
      <span>分钟</span>
    </label>
    <div class="mapping-error" id="auto-close-error"></div>
    <div class="header-actions">
      <button id="open-manager-btn">标签组管理</button>
      <button id="organize">重新整理所有标签页</button>
      <button id="sort-tabs-btn">排序标签页</button>
      <button id="close-group-btn">关闭所有分组</button>
    </div>
  </div>
  
  <div class="mapping-section">
    <h2>域名映射</h2>
    <div class="mapping-form">
      <input type="text" id="mapping-domain" placeholder="域名，如 code.alibaba-inc.com">
      <input type="text" id="mapping-label" maxlength="100" placeholder="标签名，如 代码仓库">
      <button id="add-mapping-btn">添加映射</button>
      <div class="mapping-error" id="mapping-error"></div>
    </div>
    <div class="mapping-actions">
      <button id="export-mappings-btn">导出</button>
      <button id="import-mappings-btn">导入</button>
      <input type="file" id="import-file-input" accept=".json,application/json" style="display: none;">
    </div>
    <div id="mapping-list">
      <div class="empty-mappings">暂无映射规则，默认按域名分组</div>
    </div>
  </div>
  
  <div class="groups-container">
    <h2>标签组</h2>
    <div id="groups-list">
      <div class="empty-groups">暂无标签组</div>
    </div>
  </div>
  
  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
